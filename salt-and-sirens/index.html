<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Salt &amp; Sirens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen 3D canvas, HUD pinned to the four corners, menus as centered sheets. */
:root{
  color-scheme:dark;
  --ink:#0c1522;            /* harbor-night navy: panels and ground */
  --ink-a:rgba(10,18,30,.78);
  --line:rgba(244,236,220,.22);
  --paper:#f4ecdc;          /* warm off-white text */
  --mute:#a9b4bf;
  --sand:#f2d49a;           /* money, highlights */
  --coral:#ff6b4f;          /* brand accent, objectives, GPS */
  --sea:#34c6b5;            /* armor, friendly blips */
  --red:#ff3d47; --blue:#3f7dff;
  --hp:#6be38a;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --ui:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--ui);
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
[hidden]{display:none!important}
button{font-family:var(--ui);color:inherit}
button:focus-visible{outline:2px solid var(--sand);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#mm{position:absolute;left:calc(16px + var(--sl));top:calc(16px + var(--st));width:188px;height:188px;border-radius:26px;overflow:hidden;
  background:#10283c;box-shadow:0 0 0 2px rgba(244,236,220,.8),0 8px 26px rgba(0,0,0,.5)}
#mmc{width:100%;height:100%;display:block}
#zone{position:absolute;left:calc(18px + var(--sl));top:calc(214px + var(--st));font:700 17px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;
  transition:opacity .6s}
#zone small{display:block;font-weight:500;font-size:13px;letter-spacing:.1em;color:var(--mute);margin-top:4px}
#tr{position:absolute;right:calc(16px + var(--sr));top:calc(14px + var(--st));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#money{font:400 30px/1 var(--display);color:var(--sand);letter-spacing:.02em}
#money.up{animation:pop .5s}
@keyframes pop{0%{transform:scale(1.25);color:#fff}100%{transform:scale(1)}}
#clock{font:600 18px/1 var(--ui);letter-spacing:.12em;color:var(--paper)}
#heat{display:flex;gap:5px;margin-top:2px}
#heat i{width:24px;height:11px;border-radius:3px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
#heat i.on{background:var(--red);box-shadow:0 0 10px var(--red)}
#heat.b i.on:nth-child(even),#heat.a i.on:nth-child(odd){background:var(--blue);box-shadow:0 0 10px var(--blue)}
#heat.cool i.on{background:#c98b8f;box-shadow:none}
#cool{width:136px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
#cool b{display:block;height:100%;width:0;background:var(--sea)}
#coolT{font:600 12px/1 var(--ui);letter-spacing:.14em;color:var(--sea)}

#bl{position:absolute;left:calc(16px + var(--sl));bottom:calc(16px + var(--sb));display:flex;flex-direction:column;gap:6px;width:210px}
.bar{height:9px;border-radius:5px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);overflow:hidden}
.bar b{display:block;height:100%;width:100%;border-radius:5px;transition:width .25s}
#hpBar b{background:var(--hp)} #arBar b{background:var(--sea)}
#hpBar.low b{background:var(--red);animation:blink .6s infinite}
@keyframes blink{50%{opacity:.35}}
#weapon{display:flex;align-items:baseline;gap:10px;font:700 20px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase}
#weapon small{font:600 15px/1 var(--ui);color:var(--sand)}

#br{position:absolute;right:calc(16px + var(--sr));bottom:calc(16px + var(--sb));display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#speedo{display:flex;align-items:baseline;gap:6px}
#kmh{font:400 46px/1 var(--display);font-variant-numeric:tabular-nums}
#speedo small{font:700 14px/1 var(--ui);letter-spacing:.16em;color:var(--mute)}
#vname{font:600 15px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
#vhp{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
#vhp b{display:block;height:100%;background:var(--sand)}
#radio{font:700 16px/1.15 var(--ui);letter-spacing:.1em;text-align:right;text-transform:uppercase;transition:opacity .8s}
#radio small{display:block;font-weight:500;letter-spacing:.04em;text-transform:none;color:var(--sand);font-size:14px}

#obj{position:absolute;left:50%;top:calc(16px + var(--st));transform:translateX(-50%);max-width:min(560px,calc(100vw - 460px));
  padding:9px 16px;border-radius:10px;background:var(--ink-a);box-shadow:inset 0 0 0 1px var(--line);font:600 18px/1.25 var(--ui);letter-spacing:.03em;text-align:center}
#obj b{color:var(--coral);font-weight:700}
#obj .t{display:block;font:400 22px/1.1 var(--display);color:var(--sand);margin-top:4px}
#hint{position:absolute;left:50%;bottom:calc(92px + var(--sb));transform:translateX(-50%);padding:8px 14px;border-radius:8px;background:var(--ink-a);
  font:600 17px/1 var(--ui);letter-spacing:.06em;white-space:nowrap}
#hint kbd{display:inline-block;min-width:18px;padding:3px 6px;margin:0 3px;border-radius:5px;background:var(--paper);color:var(--ink);font:700 14px/1 var(--ui);text-align:center;text-shadow:none}
#sub{position:absolute;left:50%;bottom:calc(140px + var(--sb));transform:translateX(-50%);max-width:min(720px,90vw);text-align:center;font:600 21px/1.3 var(--ui);
  text-shadow:0 2px 4px #000,0 0 14px rgba(0,0,0,.8)}
#sub b{color:var(--sand)}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 0 0 3px rgba(0,0,0,.4)}
#cross::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:2px;background:#fff}
#cross.hit{box-shadow:0 0 0 2px var(--coral),0 0 0 3px rgba(0,0,0,.4)}
#toasts{position:absolute;right:calc(16px + var(--sr));top:calc(150px + var(--st));display:flex;flex-direction:column;gap:8px;align-items:flex-end;width:min(330px,60vw)}
.toast{padding:10px 14px;border-radius:12px;background:var(--ink-a);box-shadow:inset 0 0 0 1px var(--line);font:500 16px/1.3 var(--ui);animation:tin .35s ease-out}
.toast b{display:block;font:700 13px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin-bottom:4px}
.toast.out{opacity:0;transform:translateX(30px);transition:.4s}
@keyframes tin{from{opacity:0;transform:translateX(40px)}}
#big{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none}
#big h1{margin:0;font:400 clamp(40px,8vw,92px)/1 var(--display);letter-spacing:.02em;color:var(--sand);text-shadow:0 4px 0 #000,0 0 30px rgba(0,0,0,.6);animation:bigin .5s cubic-bezier(.2,1.6,.4,1)}
#big h1.bad{color:var(--coral)}
#big p{margin:12px 0 0;font:600 22px/1.2 var(--ui);letter-spacing:.1em;text-transform:uppercase}
@keyframes bigin{from{transform:scale(1.6);opacity:0}}
#timer{position:absolute;left:50%;top:calc(96px + var(--st));transform:translateX(-50%);font:400 34px/1 var(--display);color:var(--paper);font-variant-numeric:tabular-nums}
#timer.low{color:var(--coral)}
#race{position:absolute;left:calc(16px + var(--sl));top:calc(250px + var(--st));font:600 18px/1.3 var(--ui);letter-spacing:.06em}
#race b{font:400 32px/1 var(--display);color:var(--sand)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
#fade.on{opacity:1}
#lockHint{position:absolute;left:50%;top:70%;transform:translateX(-50%);font:600 16px/1 var(--ui);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}

/* ---------- Touch ---------- */
#touch{position:fixed;inset:0;pointer-events:none}
#touch .zone{position:absolute;pointer-events:auto}
#joyZone{left:0;bottom:0;width:45%;height:62%}
#lookZone{right:0;top:0;width:58%;height:100%}
#joy{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);background:rgba(10,18,30,.25);display:none}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(244,236,220,.55)}
.tb{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;border:0;background:rgba(10,18,30,.55);box-shadow:inset 0 0 0 2px rgba(244,236,220,.5);
  font:700 13px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--paper);display:flex;align-items:center;justify-content:center}
.tb.on{background:rgba(255,107,79,.55)}
.tb.big{width:84px;height:84px;font-size:15px}
.tb.sm{width:48px;height:48px;font-size:11px}

/* ---------- Screens ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--st)) calc(16px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl))}
#title{flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:0;padding-bottom:calc(8vh + var(--sb));padding-left:calc(7vw + var(--sl));
  background:linear-gradient(90deg,rgba(12,21,34,.92) 0%,rgba(12,21,34,.6) 38%,rgba(12,21,34,0) 70%)}
#logo{margin:0;font:400 clamp(52px,9.5vw,132px)/.86 var(--display);color:var(--paper);letter-spacing:-.01em;text-shadow:0 6px 0 rgba(0,0,0,.35)}
#logo span{display:block}
#logo em{font-style:normal;color:var(--coral)}
#tag{margin:18px 0 0;max-width:30ch;font:500 22px/1.3 var(--ui);color:var(--paper);letter-spacing:.02em}
#tag b{color:var(--sand);font-weight:700;letter-spacing:.14em;text-transform:uppercase;display:block;font-size:15px;margin-bottom:6px}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:30px;min-width:240px}
.btn{appearance:none;border:0;cursor:pointer;text-align:left;padding:12px 20px;border-radius:12px;background:rgba(244,236,220,.1);box-shadow:inset 0 0 0 1px var(--line);
  font:700 21px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;transition:background .15s,transform .15s}
.btn:hover,.btn:focus-visible{background:var(--coral);color:#1b0b07;transform:translateX(6px)}
.btn.primary{background:var(--paper);color:var(--ink)}
.btn.primary:hover{background:var(--coral)}
.btn small{display:block;font:500 14px/1.2 var(--ui);letter-spacing:.04em;text-transform:none;opacity:.75;margin-top:4px}
#titleFoot{position:absolute;right:calc(18px + var(--sr));bottom:calc(14px + var(--sb));font:500 14px/1.3 var(--ui);color:var(--mute);text-align:right}

.sheet{width:min(920px,100%);max-height:100%;overflow:auto;border-radius:20px;background:rgba(12,21,34,.94);box-shadow:inset 0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.6);
  padding:22px 24px 24px}
.sheet h2{margin:0 0 4px;font:400 34px/1 var(--display);color:var(--sand)}
.sheet h3{margin:18px 0 8px;font:700 15px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--coral)}
.sheet p{margin:6px 0;font:500 18px/1.4 var(--ui);color:var(--paper);max-width:65ch}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 16px}
.tab{appearance:none;border:0;cursor:pointer;padding:9px 14px;border-radius:9px;background:rgba(244,236,220,.08);font:700 15px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase}
.tab.on{background:var(--paper);color:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid rgba(244,236,220,.1);font:500 18px/1.3 var(--ui)}
.row > div{min-width:0}
.row small{display:block;color:var(--mute);font-size:15px}
.row .btn{padding:9px 14px;font-size:16px}
.row .btn:hover{transform:none}
.row.done{opacity:.55}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 28px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font:500 17px/1.3 var(--ui)}
.keys kbd{justify-self:start;padding:3px 8px;border-radius:6px;background:rgba(244,236,220,.14);font:700 14px/1.2 var(--ui);letter-spacing:.06em;white-space:nowrap}
#mapWrap{position:relative;width:100%;aspect-ratio:2300/1850;max-height:62vh;border-radius:14px;overflow:hidden;background:#10283c;cursor:crosshair}
#mapC{width:100%;height:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font:600 14px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{appearance:none;border:0;cursor:pointer;padding:8px 12px;border-radius:8px;background:rgba(244,236,220,.08);font:700 15px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase}
.seg button.on{background:var(--sea);color:#04201c}
input[type=range]{width:180px;accent-color:var(--coral)}
#card .sheet{width:min(560px,100%)}
#card .who{font:700 14px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--coral)}
#card .pay{font:400 26px/1 var(--display);color:var(--sand);margin-top:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.actions .btn{flex:1 1 160px;text-align:center}
.actions .btn:hover{transform:none}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--ink);z-index:50;font:600 18px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
#loading b{font:400 44px/1 var(--display);color:var(--paper);letter-spacing:0;text-transform:none}
#loading b em{font-style:normal;color:var(--coral)}
#err{position:fixed;left:16px;right:16px;bottom:16px;padding:12px 16px;border-radius:12px;background:#3b0d0d;color:#ffd9d4;font:500 16px/1.4 var(--ui);z-index:60}
@media (max-width:700px){
  #mm{width:132px;height:132px;border-radius:20px}
  #zone{top:calc(156px + var(--st));font-size:14px}
  #money{font-size:24px}
  #obj{max-width:calc(100vw - 300px);font-size:15px;padding:7px 10px}
  #obj .t{font-size:18px}
  #toasts{top:calc(120px + var(--st))}
  #bl{width:150px}
  #kmh{font-size:34px}
  #race{top:calc(186px + var(--st))}
}
.tbtop{top:calc(262px + var(--st))}
body.touch #br{right:auto;left:calc(16px + var(--sl));bottom:calc(46px + var(--sb));align-items:flex-start}
body.touch #radio{text-align:left}
@media (max-height:520px){
  #mm{width:120px;height:120px;border-radius:18px}
  #zone{top:calc(144px + var(--st));font-size:13px}
  #zone small{display:none}
  #money{font-size:22px} #clock{font-size:15px} #heat i{width:18px;height:9px}
  #toasts{top:calc(92px + var(--st));width:min(300px,45vw)}
  .toast{font-size:14px;padding:7px 10px}
  #obj{font-size:14px;padding:6px 10px;max-width:calc(100vw - 340px)}
  #obj .t{font-size:16px}
  #sub{bottom:calc(104px + var(--sb));font-size:16px}
  #hint{bottom:calc(84px + var(--sb));font-size:14px}
  #kmh{font-size:30px}
  #race{top:calc(166px + var(--st));font-size:15px}
  #big h1{font-size:clamp(30px,7vw,64px)}
  #big p{font-size:16px}
  #bl{width:150px}
  .tbtop{top:calc(168px + var(--st))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<div id="hud" hidden>
  <div id="mm"><canvas id="mmc" width="188" height="188"></canvas></div>
  <div id="zone"></div>
  <div id="tr">
    <div id="money">$0</div>
    <div id="clock">09:00</div>
    <div id="heat"><i></i><i></i><i></i><i></i><i></i></div>
    <div id="cool" hidden><b></b></div>
    <div id="coolT" hidden>Out of sight</div>
  </div>
  <div id="bl">
    <div id="weapon"></div>
    <div class="bar" id="hpBar"><b></b></div>
    <div class="bar" id="arBar"><b></b></div>
  </div>
  <div id="br">
    <div id="radio"></div>
    <div id="vname"></div>
    <div id="vhp"><b></b></div>
    <div id="speedo"><span id="kmh">0</span><small>KM/H</small></div>
  </div>
  <div id="obj" hidden></div>
  <div id="timer" hidden></div>
  <div id="race" hidden></div>
  <div id="hint" hidden></div>
  <div id="sub" hidden></div>
  <div id="cross" hidden></div>
  <div id="lockHint" hidden>Click to look around</div>
  <div id="toasts"></div>
  <div id="big"></div>
</div>

<div id="touch" hidden>
  <div class="zone" id="lookZone"></div>
  <div class="zone" id="joyZone"></div>
  <div id="joy"><i></i></div>
</div>

<div id="title" class="screen" hidden>
  <h1 id="logo"><span>Salt</span><span><em>&amp;</em> Sirens</span></h1>
  <p id="tag"><b>Port Mareva</b>A harbor city of fast cars, loud sirens and bad decisions. You just got off the bus.</p>
  <div class="menu" id="titleMenu"></div>
  <div id="titleFoot">An original open-world game.<br>All of it is made in code: city, cars, people, music.</div>
</div>

<div id="pause" class="screen" hidden>
  <div class="sheet">
    <h2>Paused</h2>
    <div class="tabs" id="pauseTabs"></div>
    <div id="pauseBody"></div>
    <div class="actions" id="pauseActions"></div>
  </div>
</div>

<div id="shop" class="screen" hidden><div class="sheet" id="shopSheet"></div></div>
<div id="card" class="screen" hidden><div class="sheet" id="cardSheet"></div></div>
<div id="fade"></div>
<div id="loading"><b>Salt <em>&amp;</em> Sirens</b><span id="loadMsg">Building Port Mareva…</span></div>
<div id="err" hidden></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<script type="module">
// =====================================================================
//  SALT & SIRENS - an original open-world crime sandbox in Port Mareva.
//  One file, no build step. Everything (city, cars, people, sound,
//  music) is generated in code.
// =====================================================================
import * as THREE from 'three';

// ---------------------------------------------------------------- helpers
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function angWrap(a) { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; }
const angDamp = (a, b, k, dt) => a + angWrap(b - a) * (1 - Math.exp(-k * dt));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const wr = mulberry32(20261125);            // world generation (deterministic)
const wrand = (a, b) => a + wr() * (b - a);
const wpick = a => a[(wr() * a.length) | 0];
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const chance = p => Math.random() < p;
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263); h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
const d2 = (ax, az, bx, bz) => { const x = ax - bx, z = az - bz; return x * x + z * z; };
const fmt$ = n => '$' + Math.floor(n).toLocaleString('en-US');
const $ = id => document.getElementById(id);
const heading = (dx, dz) => Math.atan2(dx, dz);   // forward = (sin h, cos h)

// ---------------------------------------------------------------- storage
const store = {
  get(k, d) { try { const v = localStorage.getItem('saltsirens.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('saltsirens.' + k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },

const CAM = {
  yaw: 0, pitch: 0.22, shake: 0, kick: 0, mode: 0, lastLook: -9, aimB: 0, fov: 66, tgt: new THREE.Vector3(), pos: new THREE.Vector3(), dist: 4.4,
  update(dt) {
    const lx = inp.lookX, ly = inp.lookY;
    this.yaw -= lx; this.pitch = clamp(this.pitch + ly, -0.45, 1.25);
    if (Math.abs(lx) + Math.abs(ly) > 1e-4) this.lastLook = GAME.t;
    if (inp.camP) { this.mode = (this.mode + 1) % 3; AU.play('ui'); }
    const v = Player.vehicle;
    let dist, th, shoulder = 0, fovT = 66;
    if (v) {
      const S = v.M.S;
      if (GAME.t - this.lastLook > 1.3) {
        const tgtYaw = v.vf < -4 ? v.h : v.h;
        this.yaw = angDamp(this.yaw, tgtYaw, v.speed > 3 ? 3.2 : 1.2, dt);
        this.pitch = damp(this.pitch, 0.2 + (this.mode === 1 ? 0.12 : 0), 2.5, dt);
      }
      dist = (v.T.len * 0.85 + 3.4) * (this.mode === 1 ? 1.55 : 1);
      th = v.y + v.visY + S.yt * 0.75 + 0.55;
      this.tgt.set(v.x, th, v.z);
      fovT = 66 + clamp(v.speed / 45, 0, 1) * 14;
      if (this.mode === 2) { // hood camera
        const s = Math.sin(v.h), c = Math.cos(v.h);
        this.pos.set(v.x + s * (v.T.len * 0.08), v.y + v.visY + S.yt * 0.88, v.z + c * (v.T.len * 0.08));
        camera.position.copy(this.pos);
        const ly2 = this.pos.y - 0.6 + Math.sin(-this.pitch + 0.2) * 3;
        camera.lookAt(this.pos.x + Math.sin(this.yaw) * 30, ly2 + 0.6 - this.pitch * 8 + 1.6, this.pos.z + Math.cos(this.yaw) * 30);
        this.finish(dt, fovT + 4);
        return;
      }
    } else {
      this.aimB = damp(this.aimB, Player.aiming ? 1 : 0, 12, dt);
      dist = lerp(Player.swim ? 5 : 4.4, 2.2, this.aimB);
      shoulder = 0.6 * this.aimB;
      th = Player.y + lerp(1.55, 1.62, this.aimB);
      this.tgt.set(Player.x, th, Player.z);
      fovT = lerp(66, 52, this.aimB);
    }
    const fx = Math.sin(this.yaw), fz = Math.cos(this.yaw), rx = -Math.cos(this.yaw), rz = Math.sin(this.yaw);
    const cp = Math.cos(this.pitch), spi = Math.sin(this.pitch);
    const tx = this.tgt.x + rx * shoulder, ty = this.tgt.y, tz = this.tgt.z + rz * shoulder;
    let px = tx - fx * cp * dist, py = ty + spi * dist, pz = tz - fz * cp * dist;
    // keep the camera out of walls
    const hit = rayCols(tx, ty, tz, px - tx, py - ty, pz - tz, 1);
    if (hit.c) { const t = Math.max(0.08, hit.t - 0.06); px = tx + (px - tx) * t; py = ty + (py - ty) * t; pz = tz + (pz - tz) * t; }
    py = Math.max(py, Math.max(surfaceH(px, pz), WL) + 0.35);
    this.dist = damp(this.dist, Math.hypot(px - tx, pz - tz, py - ty), 30, dt);
    this.pos.set(px, py, pz);
    camera.position.copy(this.pos);
    camera.lookAt(tx, ty + (v ? 0 : 0.05) - this.kick * 0, tz);
    this.finish(dt, fovT);
  },
  finish(dt, fovT) {
    if (this.shake > 0) {
      const s = this.shake * 0.35;
      camera.position.x += rand(-s, s); camera.position.y += rand(-s, s) * 0.6; camera.position.z += rand(-s, s);
      this.shake = Math.max(0, this.shake - dt * 1.8);
    }
    if (this.kick > 0) { camera.rotateX(this.kick); this.kick = damp(this.kick, 0, 18, dt); }
    this.fov = damp(this.fov, fovT, 4, dt);
    if (Math.abs(camera.fov - this.fov) > 0.05) { camera.fov = this.fov; camera.updateProjectionMatrix(); }
    listener.x = camera.position.x; listener.z = camera.position.z; listener.yaw = this.yaw;
  }
};

  list: [], mats: new Map(),
  init() {
    this.tex = canvasTex(4, 128, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.7, 'rgba(255,255,255,.35)'); gr.addColorStop(1, 'rgba(255,255,255,.9)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });

  },
  mat(color) {
    let m = this.mats.get(color);
    if (!m) { m = new THREE.MeshBasicMaterial({ color, map: this.tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false }); this.mats.set(color, m); }

  },
  remove(M) { if (!M) return; scene.remove(M.g); const i = this.list.indexOf(M); if (i >= 0) this.list.splice(i, 1); },

    const k = (v ? lerp(1.05, 0.5, clamp(v.speed / 45, 0, 1)) : 1.25) * k0;
    this.mk = damp(this.mk || k, k, 3, 1 / 60);
    const sc = this.mk, cx = S / 2, cy = S * 0.58, a = CAM.yaw - Math.PI;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = '#0f2a3d'; g.fillRect(0, 0, S, S);
    g.save();
    g.translate(cx, cy); g.rotate(a); g.scale(sc, sc); g.translate(-Player.x, -Player.z);
    g.drawImage(MAP.base, MAP.x0, MAP.z0, MAP.w / MAP.s, MAP.h / MAP.s);
    const gps = Missions.gps;
    if (gps && gps.length > 1) {
      g.strokeStyle = Missions.cur ? '#ff6b4f' : '#f2d49a'; g.lineWidth = 5 * k0 / sc; g.lineJoin = 'round'; g.lineCap = 'round';
      g.beginPath(); g.moveTo(gps[0][0], gps[0][1]); for (let i = 1; i < gps.length; i++) g.lineTo(gps[i][0], gps[i][1]); g.stroke();
    }
    g.restore();
    const ca = Math.cos(a), sa = Math.sin(a), R = S / 2 - 9 * k0;
    const toS = (wx, wz) => { const dx = (wx - Player.x) * sc, dz = (wz - Player.z) * sc; return [cx + dx * ca - dz * sa, cy + dx * sa + dz * ca]; };
    const clampEdge = (p) => { const dx = p[0] - S / 2, dy = p[1] - S / 2, m = Math.max(Math.abs(dx), Math.abs(dy)); if (m > R) { p[0] = S / 2 + dx / m * R; p[1] = S / 2 + dy / m * R; p.edge = true; } return p; };
    const dot = (p, r, fill, txt, ring) => {
      g.beginPath(); g.arc(p[0], p[1], r * k0, 0, TAU); g.fillStyle = fill; g.fill();
      if (ring) { g.lineWidth = 2 * k0; g.strokeStyle = '#0c1522'; g.stroke(); }
      if (txt) { g.fillStyle = '#0c1522'; g.font = `700 ${Math.round(r * 1.35 * k0)}px 'Barlow Condensed', Arial Narrow, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, p[0], p[1] + 0.5 * k0); }
    };
    // places
    for (const key of ['safe', 'guns', 'clothes', 'spray', 'courier', 'hospital', 'police', 'dex', 'lola', 'rook']) {
      const p = W.places[key];
      const avail = ['dex', 'lola', 'rook'].includes(key);
      const has = avail && Missions.available(key);
      const s = toS(p.x, p.z);
      const inR = Math.abs(s[0] - S / 2) < R && Math.abs(s[1] - S / 2) < R;
      if (!inR && !has) continue;
      clampEdge(s);
      dot(s, has ? 8 : 6.5, has ? '#ff6b4f' : p.color, p.icon, true);
    }
    // police
    const ph = (GAME.t * 5 | 0) % 2;
    for (const u of VEH) if (u.type === 'police' && !u.dead && (Heat.level > 0 || d2(u.x, u.z, Player.x, Player.z) < 90 * 90)) { const s = toS(u.x, u.z); if (Math.abs(s[0] - S / 2) < R && Math.abs(s[1] - S / 2) < R) dot(s, 4, Heat.level > 0 ? (ph ? '#ff3d47' : '#3f7dff') : '#7f9cc8'); }
    for (const p of PEDS) if (p.kind === 'cop' && Heat.level > 0) { const s = toS(p.x, p.z); if (Math.abs(s[0] - S / 2) < R && Math.abs(s[1] - S / 2) < R) dot(s, 2.6, ph ? '#3f7dff' : '#ff3d47'); }
    if (Police.heli) { const s = clampEdge(toS(Police.heli.x, Police.heli.z)); dot(s, 5, '#3f7dff', 'H'); }
    // target
    const T = Missions.target();
    if (T) { const s = clampEdge(toS(T.x, T.z)); dot(s, 6.5, T.color, '', true); }
    if (Missions.cur && Missions.cur.target && !Missions.cur.target.gone && Missions.cur.S && ['getcar', 'ram'].includes(Missions.cur.S.do)) { const s = clampEdge(toS(Missions.cur.target.x, Missions.cur.target.z)); g.fillStyle = '#ff6b4f'; g.fillRect(s[0] - 5 * k0, s[1] - 5 * k0, 10 * k0, 10 * k0); }
    // north
    const n = clampEdge([cx - (-1) * sa * 999, cy + (-1) * ca * 999]);
    dot(n, 6, 'rgba(244,236,220,.9)', 'N');
    // player arrow
    const ph2 = Player.h + (v ? 0 : 0), hx = Math.sin(v ? v.h : Player.h), hz = Math.cos(v ? v.h : Player.h);
    const ax = hx * ca - hz * sa, az = hx * sa + hz * ca, px = -az, pz = ax;
    g.beginPath(); g.moveTo(cx + ax * 9 * k0, cy + az * 9 * k0); g.lineTo(cx - ax * 6 * k0 + px * 6 * k0, cy - az * 6 * k0 + pz * 6 * k0); g.lineTo(cx - ax * 3 * k0, cy - az * 3 * k0); g.lineTo(cx - ax * 6 * k0 - px * 6 * k0, cy - az * 6 * k0 - pz * 6 * k0); g.closePath();
    g.fillStyle = '#f4ecdc'; g.fill(); g.lineWidth = 2 * k0; g.strokeStyle = '#0c1522'; g.stroke();
  }
};

  drawMap() {
    const cv = $('mapC'), wrap = $('mapWrap');
    const w = wrap.clientWidth, h = wrap.clientHeight, dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const g = cv.getContext('2d'), s = Math.min(cv.width / (MAP.x1 - MAP.x0), cv.height / (MAP.z1 - MAP.z0));
    const ox = (cv.width - (MAP.x1 - MAP.x0) * s) / 2, oz = (cv.height - (MAP.z1 - MAP.z0) * s) / 2;
    const X = x => ox + (x - MAP.x0) * s, Z = z => oz + (z - MAP.z0) * s;
    g.fillStyle = '#0f2a3d'; g.fillRect(0, 0, cv.width, cv.height);
    g.drawImage(MAP.base, ox, oz, (MAP.x1 - MAP.x0) * s, (MAP.z1 - MAP.z0) * s);

    if (gps) { g.strokeStyle = Missions.cur ? '#ff6b4f' : '#f2d49a'; g.lineWidth = 3 * dpr; g.beginPath(); gps.forEach((p, i) => i ? g.lineTo(X(p[0]), Z(p[1])) : g.moveTo(X(p[0]), Z(p[1]))); g.stroke(); }

    for (const p of Object.values(W.places)) { if (!p.icon) continue; const has = Missions.available(p.key); icon(p.x, p.z, has ? 9 : 7, has ? '#ff6b4f' : p.color, p.icon); }

    g.fillStyle = '#0c1522'; g.beginPath(); g.arc(X(Player.x), Z(Player.z), 2.5 * dpr, 0, TAU); g.fill();
    cv.onclick = e => {
      const r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) * dpr, mz = (e.clientY - r.top) * dpr;

function saveGame() {
  if (!SAVE || GAME.state === 'title' || GAME.state === 'boot') return;

}

  const q = Q();

  setupShadows();

}
GAME.radioSt = 0;
GAME.titleA = 0.6;
GAME.lockHintUntil = 0;
GAME.stats = {};

function titleMenu(confirmNew) {

  if (confirmNew) {
    m.innerHTML = `<p style="margin:0 0 6px;font:500 18px/1.3 var(--ui)">This replaces your saved game. Start over?</p><button class="btn primary" data-t="new">Start over</button><button class="btn" data-t="back">Keep my save</button>`;
  } else {
    m.innerHTML = (has ? `<button class="btn primary" data-t="cont">Continue<small>${(() => { const s = store.get('save', {}); return `${fmt$(s.money || 0)} · story ${s.story || 0} of ${STORY.length}`; })()}</small></button>` : '') +
      `<button class="btn ${has ? '' : 'primary'}" data-t="${has ? 'ask' : 'new'}">New game</button><button class="btn" data-t="set">Settings</button><button class="btn" data-t="ctl">Controls</button>`;

// ------------------------------------------------- main loop
const STEP = 1 / 60;
let acc = 0, lastT = performance.now();
function physStep(dt) {
  for (let i = 0; i < VEH.length; i++) VEH[i].update(dt);
  for (let i = 0; i < VEH.length; i++) {
    const a = VEH[i]; const aIdle = a.mode === 'rail' || a.sleep;
    for (let j = i + 1; j < VEH.length; j++) {
      const b = VEH[j];
      if (aIdle && (b.mode === 'rail' || b.sleep)) continue;
      collidePair(a, b);
    }
  }
  vehPedHits();
}
function update(dt) {
  GAME.time = (GAME.time + dt / 60) % 24;
  Player.update(dt);
  acc += dt; let n = 0;
  while (acc >= STEP && n < 4) { physStep(STEP); acc -= STEP; n++; }
  if (n === 4) acc = 0;
  Traffic.update(dt); Peds.update(dt); Police.update(dt); Heat.update(dt);
  Missions.update(dt); Pickups.update(dt); Shells.update(dt); Markers.update(dt);
  if ((GAME.t * 2 | 0) !== GAME._rp) { GAME._rp = GAME.t * 2 | 0; repairProps(); }
  CAM.update(dt);
  TouchUI.update();
  // ambience: city hum, surf near the beach, wind when fast
  const v = Player.vehicle;
  const surf = clamp(1 - Math.abs(Player.x - 800) / 120, 0, 1) + (isWater(Player.x + 30, Player.z) || isWater(Player.x - 30, Player.z) || isWater(Player.x, Player.z + 30) ? 0.5 : 0);
  AU.ambience(Player.x < 668 && Player.x > -668 ? 1 : 0.4, clamp(surf, 0, 1), v ? clamp(v.speed / 50, 0, 1) : 0);
}
function titleUpdate(dt) {
  GAME.titleA += dt * 0.035;
  const a = GAME.titleA, cx = 600, cz = 40, r = 260;
  camera.position.set(cx + Math.sin(a) * r, 70 + Math.sin(a * 0.7) * 12, cz + Math.cos(a) * r);
  camera.lookAt(cx - 60, 18, cz);
  if (camera.fov !== 55) { camera.fov = 55; camera.updateProjectionMatrix(); }
  listener.x = camera.position.x; listener.z = camera.position.z;
  Player.x = cx + Math.sin(a) * 160; Player.z = cz + Math.cos(a) * 160;
  acc += dt; let n = 0; while (acc >= STEP && n < 2) { physStep(STEP); acc -= STEP; n++; } if (n === 2) acc = 0;
  Traffic.update(dt);
  GAME.time = 18.4 + Math.sin(GAME.t * 0.02) * 0.3;
}
function updateSun() {
  const c = CAM.tgt.lengthSq() > 0 && GAME.state === 'play' ? CAM.tgt : camera.position;
  const q = Q(), texel = 2 * SHR / (q.shadow || 1024);
  const tx = Math.round(c.x / texel) * texel, tz = Math.round(c.z / texel) * texel;
  sun.target.position.set(tx, 0, tz);
  sun.position.set(tx + LIGHT_DIR.x * 420, LIGHT_DIR.y * 420, tz + LIGHT_DIR.z * 420);
  sun.target.updateMatrixWorld();
}
function render(dt) {
  applyTime(GAME.time);
  updateEnv(false);
  for (const v of VEH) v.syncMesh(dt);
  updateWheels(); drawHumans(); FX.update(dt); updateTrafficLights();
  if (PM.wheel) PM.wheel.rotation.z += dt * 0.12;
  if (PM.beam) { PM.beam.rotation.y += dt * 0.9; PM.beam.material.opacity = nightU.value * 0.16; PM.beam.visible = nightU.value > 0.05; }
  { const v = Player.vehicle, n = nightU.value;
    if (v && n > 0.15 && !v.dead && !v.sunk) { const s = Math.sin(v.h), c = Math.cos(v.h), f = v.T.len / 2;
      headSpot.position.set(v.x + s * f, v.y + 1.0, v.z + c * f); headSpot.target.position.set(v.x + s * (f + 24), v.y, v.z + c * (f + 24)); headSpot.target.updateMatrixWorld(); headSpot.intensity = 140 * n; }
    else headSpot.intensity = 0; }
  sky.position.copy(camera.position);
  waterU.uTime.value = GAME.t; skyU.uTime.value = GAME.t;
  updateSun();
  renderer.render(scene, camera);
  if (GAME.state === 'play' || GAME.state === 'pause') HUD.update(dt);
}
function tick(dt) {
  GAME.t += dt;
  readInput(dt);
  if (GAME.state === 'play') {
    if (inp.pauseP) UI.pauseOpen();
    else if (inp.mapP) UI.pauseOpen('map');
    else update(dt);
  } else if (GAME.state === 'pause') {
    if ((inp.pauseP || inp.mapP) && !GAME.fromTitle) UI.close();

}
function frame(now) {

  catch (e) { console.error(e); if (!GAME.errShown) { GAME.errShown = true; const er = $('err'); er.hidden = false; er.textContent = 'Something went wrong: ' + (e && e.message || e) + '. The game keeps running; reload the page if it misbehaves.'; setTimeout(() => er.hidden = true, 9000); } }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (GAME.state === 'play') UI.pauseOpen(); if (AU.ctx) AU.ctx.suspend && AU.ctx.suspend(); } else if (AU.ctx && AU.ctx.resume) AU.ctx.resume(); });

// test & debugging handle
window.SS = {
  GAME, Player, VEH, PEDS, W, Heat, Police, Missions, Traffic, CAM, Race, STORY, RACES, settings, inp, keys, scene, camera, renderer,

  save: () => SAVE,
  tp(x, z) { if (Player.vehicle) { const v = Player.vehicle; v.x = x; v.z = z; v.y = surfaceH(x, z); v.vx = v.vz = 0; } else Player.place(x, z, CAM.yaw); },
  give(n) { Player.earn(n); },

  drive(type) { const v = this.car(type); Player.getIn(v); return v; },

async function boot() {
  try { await Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]); } catch (e) { }
  $('loadMsg').textContent = 'Building Port Mareva…';

  initWheels(); initHumans(); FX.init(); Markers.init(); Missions.init(); HUD.init(); TouchUI.init();
  GAME.time = 18.4; applyTime(GAME.time); updateEnv(true);

  if (window.claude && window.claude.hot && window.claude.hot.snapshot) { try { window.claude.hot.snapshot(() => { saveGame(); return {}; }); } catch (e) { } }

}
window.claude && window.claude.hot && window.claude.hot.ready ? window.claude.hot.ready(boot) : boot();
